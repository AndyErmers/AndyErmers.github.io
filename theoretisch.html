<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>Theoretische voorraad</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1 class="page-title">Theoretische voorraad</h1>

    <section class="card card--tight">
      <p class="muted muted--tight">
        Schatting op basis van historie: verbruik/dag vanaf de laatste stand.
      </p>

      <div class="table-wrapper">
        <table class="table table-theo">
          <thead>
            <tr>
              <th>Product</th>
              <th>Laatste stand</th>
              <th>Verbruik/dag</th>
              <th>Dagen</th>
              <th>Theoretisch nu</th>
            </tr>
          </thead>
          <tbody id="theo-body">
            <tr><td colspan="5">Laden…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="theo-actions">
        <button type="button" id="theo-copy-btn" class="btn btn-primary" disabled>
          Kopieer lijst
        </button>
        <p id="theo-copy-status" class="muted muted--tight theo-copy-status" aria-live="polite"></p>
      </div>
    </section>

    <nav class="nav-footer">
      <a class="nav-footer__link" href="index.html">← Home</a>
    </nav>
  </main>

  <script type="module" src="theoretisch.js"></script>
</body>
</html>
