<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>Boodschappenlijst</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1 class="page-title">Boodschappenlijst</h1>

    <section class="card card--tight">
      <form id="boodschappen-form" class="form form--inline">
        <input type="date" id="boodschappen-datum" required />
        <button type="submit" class="btn btn-primary">Bereken</button>
      </form>
      <p class="muted muted--tight">
        Producten die op boodschapdag + 7 dagen op ≤ 0 staan.
      </p>

      <div class="table-wrapper">
        <table class="table table-3col">
          <thead>
            <tr>
              <th>Product</th>
              <th>Verwacht op +7</th>
              <th>Kopen</th>
            </tr>
          </thead>
          <tbody id="boodschappen-body">
            <tr><td colspan="3">Kies een datum en klik Bereken.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <nav class="nav-footer">
      <a class="nav-footer__link" href="index.html">← Home</a>
    </nav>
  </main>

  <script type="module" src="boodschappen.js"></script>
</body>
</html>
