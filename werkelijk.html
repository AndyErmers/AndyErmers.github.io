<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Werkelijke voorraad</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Werkelijke voorraad</h1>

<table class="table">
<thead>
  <tr>
    <th>Product</th>
    <th>Hoeveelheid</th>
    <th>Datum</th>
    <th>Acties</th>
  </tr>
</thead>

  <tbody id="voorraad-body">
    <tr><td colspan="3">Laden...</td></tr>
  </tbody>
</table>


    <h2>Nieuwe voorraad toevoegen</h2>

    <form id="voorraad-form" class="form">
      <input
        type="text"
        id="product"
        placeholder="Product (bijv. Melk)"
        required
      />
      <input
        type="number"
        id="hoeveelheid"
        placeholder="Hoeveelheid (bijv. 2)"
        step="0.01"
        min="0"
        required
      />
      <button type="submit">Toevoegen</button>
    </form>

    <p><a href="index.html">← Terug naar home</a></p>
  </main>

  <script type="module" src="werkelijk.js"></script>
</body>
</html>
