<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Werkelijke voorraad</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Werkelijke voorraad</h1>

    <section class="card">
      <h2>Tellijst (vandaag)</h2>
      <p class="muted">
        Elke dag wordt 20% van je producten gekozen op basis van wie het langst niet geteld is.
      </p>

      <div class="table-wrapper">
        <table class="table table-compact table-4col">
          <thead>
            <tr>
              <th>Product</th>
              <th>Huidig</th>
              <th>Geteld</th>
              <th>Actie</th>
            </tr>
          </thead>
          <tbody id="tellijst-body">
            <tr><td colspan="4">Laden...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Werkelijke voorraad</h2>

      <div class="table-wrapper">
        <table class="table table-4col">
          <thead>
            <tr>
              <th>Product</th>
              <th>Hoeveelheid</th>
              <th>Datum</th>
              <th>Acties</th>
            </tr>
          </thead>
          <tbody id="voorraad-body">
            <tr><td colspan="4">Laden...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Nieuwe voorraad toevoegen</h2>

      <form id="voorraad-form" class="form">
        <input
          type="text"
          id="product"
          placeholder="Product (bijv. Melk)"
          required
        />
        <input
          type="number"
          id="hoeveelheid"
          placeholder="Hoeveelheid (bijv. 2)"
          step="0.01"
          min="0"
          required
        />
        <button type="submit" class="btn btn-primary">Toevoegen</button>
      </form>
    </section>

    <p><a href="index.html">← Terug naar home</a></p>
  </main>

  <script type="module" src="werkelijk.js"></script>
</body>
</html>
